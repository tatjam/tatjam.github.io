<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<script>
			(function () {
				var stored = null;
				try { stored = localStorage.getItem('theme'); } catch (e) {}
				if (stored) document.documentElement.setAttribute('data-theme', stored);
			})();
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title><$POST_TITLE></title>
		<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
		<link href="/prism.css" rel="stylesheet" />
		<link rel="stylesheet" type="text/css" href="/theme.css">
		<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital@0;1&family=IBM+Plex+Sans+Condensed:ital@0;1&family=IBM+Plex+Sans:ital,wght@0,100;0,400;0,700;1,100;1,400;1,700&family=IBM+Plex+Serif:ital@0;1&display=swap" rel="stylesheet">
		<script type="text/javascript" src="/external/offsetanchor.js"></script>
		<$EXTRA_HEAD>
	</head>
	<body>
		<script src="/prism.js"></script>
		<script src="/theme-toggle.js"></script>

		<div class="navbar">
			<div class="nav-left">
				<a href="/index.html"><$POST_TITLE></a>
			</div>
			<div class="nav-right">
				<a href="<$CATEGORY_LINK>"><$CATEGORY_NAME></a>
				<a href="<$PREV_POST>" title="Previous: <$PREV_POST_TITLE>" class="nav-arrow">&#9664</a>
				<a href="<$NEXT_POST>" title="Next: <$NEXT_POST_TITLE>" class="nav-arrow">&#9654</a>
				<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode">
					<span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
				</button>
			</div>
		</div>
		<div class="intro">
			<h1><$POST_TITLE></h1>
			<p><$POST_SUMMARY><br><$POST_DATE></p>
		</div>
		<div id="page">
			<div class="main">
				<$POST_CONTENTS>
			</div>
		</div>
	</body>
</html>
